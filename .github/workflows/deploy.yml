name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Verify Worker bundle
        run: npm run check:worker
      - name: Build web app
        run: npm run build
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Configure optional TURN relay secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNIX_API_TOKEN: ${{ secrets.TURNIX_API_TOKEN }}
        run: |
          if [ -n "$TURNIX_API_TOKEN" ]; then
            printf "%s" "$TURNIX_API_TOKEN" | npx wrangler secret put TURNIX_API_TOKEN --name domino-el-cafe
          else
            echo "TURNIX_API_TOKEN not set; using STUN-only fallback."
          fi

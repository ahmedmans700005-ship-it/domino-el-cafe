name = "domino-el-cafe"
main = "src/worker.js"
compatibility_date = "2026-11-26"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "DominoRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DominoRoom"]
